[package]
name = "bh-service"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
chrono = "0.4"
download = { path = "../libs/download" }
futures = "0.3"
futures-util = "0.3"
ipsea = "1.2.1"
redb = "4.1.0"
reqwest = { version = "0.13", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
slsk = { path = "../libs/slsk" }
tokio = { version = "1.52", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dependencies.bh-server]
path = "../server"

[profile.release]
opt-level = 3
lto = true